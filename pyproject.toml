[project]
name = "parapente-selection-sites"
version = "0.1.0"
description = "Sélection géospatiale de sites de décollage parapente en Ardenne."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sites-parapente = "sites_parapente.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
